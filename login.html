<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Slide Spark AI - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    :root {
      --cyan: #00eaff;
      --blue: #38bdf8;
      --purple: #8b5cf6;
      --pink: #ec4899;
      --bg: #02030a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(0, 234, 255, 0.18);
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 20%, rgba(0,234,255,.12), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(139,92,246,.15), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(236,72,153,.10), transparent 35%),
        #02030a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0,234,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,234,255,.035) 1px, transparent 1px);
      background-size: 45px 45px;
      mask-image: linear-gradient(
        to bottom,
        transparent,
        black 18%,
        black 82%,
        transparent
      );
    }

    body::after {
      content: "";
      position: fixed;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          rgba(0,234,255,.08),
          rgba(139,92,246,.06),
          transparent 70%
        );
      filter: blur(35px);
      pointer-events: none;
      animation: pulseGlow 5s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        opacity: .7;
      }

      50% {
        transform: scale(1.12);
        opacity: 1;
      }
    }

    .container {
      width: 100%;
      max-width: 440px;
      background:
        linear-gradient(
          145deg,
          rgba(15,23,42,.90),
          rgba(3,7,18,.88)
        );
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 36px;

      box-shadow:
        0 30px 90px rgba(0,0,0,.55),
        0 0 45px rgba(0,234,255,.08),
        inset 0 1px 0 rgba(255,255,255,.05);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      position: relative;
      z-index: 2;

      animation: cardIn .65s ease-out;
    }

    .container::before {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      top: 0;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--cyan),
          var(--purple),
          var(--pink),
          transparent
        );

      box-shadow: 0 0 16px rgba(0,234,255,.6);
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo {
      text-align: center;
      margin-bottom: 27px;
    }

    .logo-icon {
      width: 68px;
      height: 68px;
      margin: auto;
      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          #00bcd4,
          #6366f1,
          #8b5cf6
        );

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
      font-weight: 900;

      box-shadow:
        0 0 20px rgba(0,234,255,.28),
        0 0 45px rgba(139,92,246,.20);

      animation: iconFloat 3.5s ease-in-out infinite;
    }

    @keyframes iconFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    .logo h1 {
      margin-top: 14px;
      font-size: 29px;
      font-weight: 900;

      background:
        linear-gradient(
          90deg,
          #00eaff,
          #38bdf8,
          #8b5cf6,
          #ec4899
        );

      background-size: 250% 250%;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation: gradientMove 5s ease infinite;
    }

    @keyframes gradientMove {
      0%, 100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    .logo p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .3px;
    }

    .tabs {
      display: flex;

      background: rgba(2,6,23,.75);

      border: 1px solid rgba(0,234,255,.10);

      padding: 5px;

      border-radius: 13px;

      margin-bottom: 25px;
    }

    .tab {
      flex: 1;

      border: none;

      background: transparent;

      padding: 12px;

      border-radius: 9px;

      cursor: pointer;

      font-size: 15px;

      font-weight: bold;

      color: #94a3b8;

      transition: all .25s ease;
    }

    .tab:hover {
      color: #67e8f9;

      background: rgba(0,234,255,.05);
    }

    .tab.active {
      background:
        linear-gradient(
          135deg,
          rgba(0,234,255,.13),
          rgba(139,92,246,.16)
        );

      color: #67e8f9;

      box-shadow:
        0 0 16px rgba(0,234,255,.08),
        inset 0 0 15px rgba(139,92,246,.05);

      border: 1px solid rgba(0,234,255,.14);
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;

      animation: formIn .25s ease-out;
    }

    @keyframes formIn {
      from {
        opacity: 0;
        transform: translateX(7px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;

      font-weight: bold;

      color: #cbd5e1;
    }

    input {
      width: 100%;

      padding: 14px;

      border:
        1px solid rgba(148,163,184,.20);

      border-radius: 11px;

      outline: none;

      font-size: 15px;

      background:
        rgba(2,6,23,.72);

      color: #f8fafc;

      transition: all .22s ease;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      border-color:
        rgba(0,234,255,.65);

      box-shadow:
        0 0 0 3px rgba(0,234,255,.08),
        0 0 20px rgba(0,234,255,.10);

      background:
        rgba(2,6,23,.9);
    }

    .submit-btn {
      width: 100%;

      padding: 15px;

      border:
        1px solid rgba(255,255,255,.14);

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #00bcd4,
          #6366f1,
          #8b5cf6
        );

      background-size: 200% 200%;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 5px;

      box-shadow:
        0 0 18px rgba(0,234,255,.18),
        0 0 35px rgba(139,92,246,.12);

      transition: all .25s ease;

      animation:
        buttonGradient 5s ease infinite;
    }

    @keyframes buttonGradient {
      0%, 100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    .submit-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 0 28px rgba(0,234,255,.32),
        0 0 50px rgba(139,92,246,.20);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .message {
      margin-top: 15px;

      text-align: center;

      font-size: 14px;

      min-height: 20px;
    }

    .security {
      margin-top: 25px;

      padding: 12px;

      background:
        rgba(16,185,129,.07);

      border:
        1px solid rgba(16,185,129,.16);

      border-radius: 10px;

      color: #86efac;

      font-size: 12px;

      text-align: center;
    }

    .brand-line {
      width: 100%;
      height: 1px;

      margin: 23px 0 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(0,234,255,.35),
          rgba(139,92,246,.35),
          transparent
        );
    }

    @media (max-width: 520px) {

      body {
        padding: 15px;
      }

      .container {
        padding: 28px 22px;
        border-radius: 22px;
      }

      .logo h1 {
        font-size: 26px;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">

      <div class="logo-icon">
        ⚡
      </div>

      <h1>
        Slide Spark AI
      </h1>

      <p>
        AI Presentation Generator
      </p>

    </div>


    <div class="tabs">

      <button
        class="tab active"
        onclick="showLogin()">

        Login

      </button>


      <button
        class="tab"
        onclick="showSignup()">

        Create Account

      </button>

    </div>


    <!-- LOGIN FORM -->

    <form
      id="loginForm"
      class="form active">

      <div class="form-group">

        <label>
          Email
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="Enter your email"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          id="loginPassword"
          placeholder="Enter your password"
          required
        >

      </div>


      <button
        type="submit"
        class="submit-btn">

        Login

      </button>


      <div
        id="loginMessage"
        class="message">
      </div>

    </form>


    <!-- SIGNUP FORM -->

    <form
      id="signupForm"
      class="form">

      <div class="form-group">

        <label>
          Name
        </label>

        <input
          type="text"
          id="signupName"
          placeholder="Enter your name"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Email
        </label>

        <input
          type="email"
          id="signupEmail"
          placeholder="Enter your email"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          id="signupPassword"
          placeholder="Create a password"
          minlength="6"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Confirm Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm your password"
          minlength="6"
          required
        >

      </div>


      <button
        type="submit"
        class="submit-btn">

        Create Account

      </button>


      <div
        id="signupMessage"
        class="message">
      </div>

    </form>


    <div class="security">

      🔒 Your account information and presentations
      are stored securely.

    </div>


    <div class="brand-line"></div>

  </div>


  <script>

    function showLogin() {

      document
        .getElementById("loginForm")
        .classList
        .add("active");

      document
        .getElementById("signupForm")
        .classList
        .remove("active");


      document
        .querySelectorAll(".tab")[0]
        .classList
        .add("active");

      document
        .querySelectorAll(".tab")[1]
        .classList
        .remove("active");

    }


    function showSignup() {

      document
        .getElementById("signupForm")
        .classList
        .add("active");

      document
        .getElementById("loginForm")
        .classList
        .remove("active");


      document
        .querySelectorAll(".tab")[1]
        .classList
        .add("active");

      document
        .querySelectorAll(".tab")[0]
        .classList
        .remove("active");

    }


    // LOGIN

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async function(e) {

          e.preventDefault();


          const email =
            document
              .getElementById("loginEmail")
              .value;

          const password =
            document
              .getElementById("loginPassword")
              .value;


          const message =
            document
              .getElementById("loginMessage");


          message.textContent =
            "Logging in...";

          message.style.color =
            "#67e8f9";


          try {

            const response =
              await fetch(
                "/api/login",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({
                    email,
                    password
                  })
                }
              );


            const data =
              await response.json();


            if (data.success) {

              message.textContent =
                "Login successful!";

              message.style.color =
                "#4ade80";


              setTimeout(() => {

                window.location.href = "/";

              }, 700);

            }

            else {

              message.textContent =
                data.message ||
                "Invalid email or password.";

              message.style.color =
                "#fb7185";

            }

          }

          catch (error) {

            message.textContent =
              "Server connection error.";

            message.style.color =
              "#fb7185";

          }

        }
      );


    // SIGN UP

    document
      .getElementById("signupForm")
      .addEventListener(
        "submit",
        async function(e) {

          e.preventDefault();


          const name =
            document
              .getElementById("signupName")
              .value;

          const email =
            document
              .getElementById("signupEmail")
              .value;

          const password =
            document
              .getElementById("signupPassword")
              .value;

          const confirmPassword =
            document
              .getElementById("confirmPassword")
              .value;


          const message =
            document
              .getElementById("signupMessage");


          if (
            password !==
            confirmPassword
          ) {

            message.textContent =
              "Passwords do not match.";

            message.style.color =
              "#fb7185";

            return;

          }


          message.textContent =
            "Creating account...";

          message.style.color =
            "#67e8f9";


          try {

            const response =
              await fetch(
                "/api/signup",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({
                    name,
                    email,
                    password
                  })
                }
              );


            const data =
              await response.json();


            if (data.success) {

              message.textContent =
                "Account created successfully!";

              message.style.color =
                "#4ade80";


              setTimeout(() => {

                showLogin();

              }, 800);

            }

            else {

              message.textContent =
                data.message ||
                "Account creation failed.";

              message.style.color =
                "#fb7185";

            }

          }

          catch (error) {

            message.textContent =
              "Server connection error.";

            message.style.color =
              "#fb7185";

          }

        }
      );

  </script>

</body>
</html>
